<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KartoffelGames Example App</title>
    <link rel="stylesheet" href="/index.css">
</head>

<body>
    <!-- The whole UI is rendered by the bundled TypeScript entry. This element is its mount point. -->
    <main id="app" data-theme="dark">
        <noscript>This example needs JavaScript / the bundled app to be built (run <code>kg page</code>).</noscript>
    </main>

    <!-- Produced by `kg build` / `kg page` from ./page/source/index.ts into ./page/bundle/app.js -->
    <script src="/bundle/app.js"></script>
</body>

</html>
